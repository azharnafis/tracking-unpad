<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lacak Sampel - Lab KTNT UNPAD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
  <style>
    body { background: #eef2cf; }
    .tracking-page { min-height: calc(100vh - 72px); display: grid; place-items: center; padding: 48px 24px; }
    .tracking-panel { width: min(100%, 680px); background: #fffef9; padding: 38px; box-shadow: 0 18px 48px rgba(45,72,32,.16); }
    .tracking-panel h1 { margin: 0 0 12px; font-size: 34px; line-height: 1.2; }
    .tracking-panel p { margin: 0 0 28px; color: #60705c; font-weight: 600; }
    .track-form { display: grid; grid-template-columns: 1fr auto; gap: 14px; }
    .track-form input { min-height: 52px; border: 1px solid #cbd3a1; padding: 0 16px; font: inherit; color: #2d4b31; }
    .track-form button { border: 0; min-height: 52px; padding: 0 24px; background: #ffe55b; color: #40511f; font-weight: 800; cursor: pointer; }
    .hint { margin-top: 18px; font-size: 13px; color: #7b8562; }
    @media (max-width: 640px) { .track-form { grid-template-columns: 1fr; } .tracking-panel { padding: 26px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="Lab KTNT UNPAD"><span class="brand-logo">Lab ktnt<br><small>Unpad</small></span><span>Lab KTNT UNPAD</span></a>
    <nav class="main-nav" aria-label="Navigasi utama"><a href="./index.html">Beranda</a><a class="active" href="./lacak-sampel.html">Lacak Sampel</a></nav>
  </header>
  <main class="tracking-page">
    <section class="tracking-panel">
      <h1>Lacak Status Sampel</h1>
      <p>Masukkan nomor sampel atau kode pengujian untuk melihat status proses laboratorium.</p>
      <form class="track-form">
        <input type="text" name="kode" placeholder="Contoh: KTNT-2026-001" aria-label="Kode sampel" />
        <button type="submit">Cek Status</button>
      </form>
      <div class="hint">Nanti form ini bisa disambungkan ke API backend yang sudah kamu buat.</div>
    </section>
  </main>
</body>
</html>
